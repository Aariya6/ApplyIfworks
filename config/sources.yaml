  google_jobs_search:
    # Disabled by default -- requires a real SerpAPI key (SERPAPI_API_KEY in .env), a paid search
    # API that legitimately surfaces Google Jobs results. This is the honest way to "search
    # Google" for more postings: no raw scraping of google.com search results, no CAPTCHA
    # bypass, no browser automation pretending to be a human typing queries -- all of which this
    # project's own safety principles already rule out, and which risk getting the account/IP
    # that runs it blocked. The adapter itself (app/adapters/serpapi.py) already no-ops if the
    # key isn't set, so enabling this is safe even with no key configured.
    enabled: false
    adapter: serpapi
    capability: LIVE_API
    url: https://serpapi.com/search
    queries:
    - AI Engineer remote Europe
    - Machine Learning Engineer remote Austria
    - Software Engineer remote Ireland
    - Data Engineer remote Italy
    - AI Product Manager remote Europe
    - Music technology engineer remote
    - Creative technologist remote
    - Digital humanities remote
  company_universe:
    enabled: true
    adapter: company_universe
    capability: COMPANY_REGISTRY
    source_file: config/company_universe.csv
    run_timeout_seconds: 900
  niche_rss_boards:
    enabled: true
    adapter: rss
    capability: LIVE_API
    # Real RSS feed URLs sourced from github.com/georgemandis/remote-working-list, a maintained
    # community list of remote job boards. Picked only feeds not already covered by an existing
    # source in this file, and only kept ones confirmed live by actually fetching them --
    # functionaljobs.com (SSL failure), jobhunt.ai (DNS resolution failure, likely defunct) and
    # privacyfirstjobs.com (404, feed path has moved) were dropped rather than shipped broken.
    urls:
    - https://www.fossjobs.net/rss/all/
    - https://www.python.org/jobs/feed/rss/
    - https://cryptojobslist.com/jobs.rss?jobLocation=Remote
    - https://iloveremote.io/rss/jobs/city/remote.rss
    - https://jobs.wordpress.net/feed/
  company_career_pages_direct:
    enabled: true
    adapter: company_career_pages
    capability: SOURCE_SPECIFIC_HTML
    # A second "CareerHound": scrapes each already-known company's own careers page directly
    # (JSON-LD JobPosting -> card selectors -> constrained job-link patterns), instead of only
    # surfacing jobs when company_universe recognizes that company's ATS. Catches postings from
    # companies on a custom-built or unrecognized careers page. Runs after company_universe/
    # company_seed populate the companies table with careers_url values to scrape.
    max_companies: 400
    timeout: 15
    run_timeout_seconds: 900
