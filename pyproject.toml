[project]
name = "remote-job-pilot"
version = "4.3.0"
description = "Local-first EU remote job discovery, application intelligence, document generation, guarded ATS workflows and evidence tracking."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "jinja2>=3.1,<4",
  "requests>=2.32,<3",
  "beautifulsoup4>=4.12,<5",
  "feedparser>=6.0,<7",
  "pydantic>=2.8,<3",
  "python-dotenv>=1.0,<2",
  "openpyxl>=3.1,<4",
  "pypdf>=5,<6",
  "python-multipart>=0.0.9,<1",
  "playwright>=1.48,<2",
  "rapidfuzz>=3.9,<4",
  "scikit-learn>=1.5,<2",
  "numpy>=1.26,<3",
  "pytest>=8,<9",
  "httpx>=0.27,<1",
  "PyYAML>=6,<7",
  "python-docx>=1.1,<2"
]

[project.scripts]
rjp = "app.cli:main"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
